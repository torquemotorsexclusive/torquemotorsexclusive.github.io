<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Torque Motorsports Exclusive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo">
    <img src="assets/logo.png" alt="Torque Motorsports">
  </a>
  <ul class="nav__links">
    <li><a href="index.html" data-nav="home">Home</a></li>
    <li><a href="inventory.html" data-nav="inventory">Inventory</a></li>
    <li><a href="dashboard.html" data-nav="dashboard">Dashboard</a></li>
  </ul>
  <a href="inventory.html" class="nav__cta">View Site</a>
</nav>

<main class="dash">

  <div class="dash__head">
    <div>
      <div class="dash__subtitle">№ 00 — Admin / Inventory Manager</div>
      <h1 class="dash__title">Manage <em style="color:var(--red);font-style:italic;">Bikes.</em></h1>
    </div>
  </div>

  <!-- Stats -->
  <div class="dash__stats" id="dashStats"></div>

  <div class="dash__layout">

    <!-- LEFT: form -->
    <aside class="form" id="formCard">
      <h2 class="form__title" id="formTitle">Add New Bike</h2>

      <input type="hidden" id="editingId" value="">

      <div class="form__group">
        <label class="form__label">Bike Name</label>
        <input type="text" class="form__input" id="f_name" placeholder="e.g. Yamaha YZF-R1">
      </div>

      <div class="form__group">
        <label class="form__label">Subtitle</label>
        <input type="text" class="form__input" id="f_sub" placeholder="e.g. 2023 · Track-prepped Superbike">
      </div>

      <div class="form__row">
        <div class="form__group">
          <label class="form__label">Year</label>
          <input type="number" class="form__input" id="f_year" placeholder="2023">
        </div>
        <div class="form__group">
          <label class="form__label">Price (PKR)</label>
          <input type="number" class="form__input" id="f_price" placeholder="6500000">
        </div>
      </div>

      <div class="form__row">
        <div class="form__group">
          <label class="form__label">Engine</label>
          <input type="text" class="form__input" id="f_engine" placeholder="998cc">
        </div>
        <div class="form__group">
          <label class="form__label">Power</label>
          <input type="text" class="form__input" id="f_power" placeholder="200 HP">
        </div>
      </div>

      <div class="form__row">
        <div class="form__group">
          <label class="form__label">Mileage</label>
          <input type="text" class="form__input" id="f_mileage" placeholder="4,200 km">
        </div>
        <div class="form__group">
          <label class="form__label">Weight</label>
          <input type="text" class="form__input" id="f_weight" placeholder="201 kg">
        </div>
      </div>

      <div class="form__group">
        <label class="form__label">Transmission</label>
        <input type="text" class="form__input" id="f_transmission" placeholder="6-speed">
      </div>

      <div class="form__group">
        <label class="form__label">Status</label>
        <select class="form__select" id="f_status">
          <option value="available">Available</option>
          <option value="sold">Sold</option>
        </select>
      </div>

      <div class="form__group">
        <label class="form__label">Description</label>
        <textarea class="form__textarea" id="f_description" placeholder="A short description of the bike..."></textarea>
      </div>

      <div class="form__group">
        <label class="form__label">Photos</label>
        <label class="form__file-zone">
          <input type="file" id="f_photos" accept="image/*" multiple style="display:none;">
          <span>📷 Click to upload photos</span>
        </label>
        <div class="form__preview" id="photoPreview"></div>
      </div>

      <div class="form__actions">
        <button class="btn btn--primary" id="saveBtn">Save Bike</button>
        <button class="btn btn--ghost" id="cancelBtn" style="display:none;">Cancel</button>
      </div>

    </aside>

    <!-- RIGHT: table -->
    <section>
      <div class="dash__table" id="dashTable"></div>
    </section>

  </div>

</main>

<footer class="footer">
  <div class="footer__bottom" style="border-top:none;">
    <span>© 2026 Torque Motorsports Exclusive — Admin Panel</span>
    <span>Data stored locally in this browser</span>
  </div>
</footer>

<script src="data.js"></script>
<script>
  setActiveNav('dashboard');

  let currentPhotos = [];
  let editingId = null;

  // ---------- Render stats ----------
  function renderStats() {
    const all = loadBikes();
    const available = all.filter(b => b.status === 'available');
    const sold = all.filter(b => b.status === 'sold');
    const totalValue = available.reduce((s, b) => s + (Number(b.price) || 0), 0);

    document.getElementById('dashStats').innerHTML = `
      <div class="dash__stat">
        <div class="dash__stat-label">Total Bikes</div>
        <div class="dash__stat-value">${all.length}</div>
      </div>
      <div class="dash__stat">
        <div class="dash__stat-label">Available</div>
        <div class="dash__stat-value dash__stat-value--accent">${available.length}</div>
      </div>
      <div class="dash__stat">
        <div class="dash__stat-label">Sold</div>
        <div class="dash__stat-value">${sold.length}</div>
      </div>
      <div class="dash__stat">
        <div class="dash__stat-label">Inventory Value</div>
        <div class="dash__stat-value" style="font-size:1.5rem;">${formatPrice(totalValue)}</div>
      </div>
    `;
  }

  // ---------- Render table ----------
  function renderTable() {
    const all = loadBikes();
    const table = document.getElementById('dashTable');

    if (all.length === 0) {
      table.innerHTML = `
        <div class="empty-state" style="padding:3rem;">
          <h3>No bikes in inventory</h3>
          <p>Add your first bike using the form on the left.</p>
        </div>`;
      return;
    }

    let html = `
      <div class="dash__row dash__row--head">
        <div>Image</div>
        <div>Bike</div>
        <div>Price</div>
        <div>Status</div>
        <div>Year</div>
        <div>Actions</div>
      </div>
    `;

    all.forEach(b => {
      const thumb = b.images && b.images.length
        ? `<img src="${b.images[0]}" alt="${b.name}">`
        : bikePlaceholderSVG();

      const statusClass = b.status === 'available' ? 'dash__status--available' : 'dash__status--sold';

      html += `
        <div class="dash__row">
          <div class="dash__thumb">${thumb}</div>
          <div>
            <div class="dash__name">${b.name}<span class="dash__name-sub">${b.sub || ''}</span></div>
          </div>
          <div class="dash__price">${formatPrice(b.price)}</div>
          <div><span class="dash__status ${statusClass}">${b.status}</span></div>
          <div style="font-family:var(--font-mono);font-size:0.85rem;">${b.year || '—'}</div>
          <div class="dash__actions">
            <button class="dash__action" onclick="editBike('${b.id}')" title="Edit">✎</button>
            <button class="dash__action" onclick="toggleStatus('${b.id}')" title="Toggle status">↻</button>
            <button class="dash__action" onclick="confirmDelete('${b.id}')" title="Delete">🗑</button>
          </div>
        </div>
      `;
    });

    table.innerHTML = html;
  }

  // ---------- Form helpers ----------
  function resetForm() {
    editingId = null;
    currentPhotos = [];
    document.getElementById('formTitle').textContent = 'Add New Bike';
    document.getElementById('editingId').value = '';
    ['f_name','f_sub','f_year','f_price','f_engine','f_power','f_mileage','f_weight','f_transmission','f_description'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('f_status').value = 'available';
    document.getElementById('photoPreview').innerHTML = '';
    document.getElementById('cancelBtn').style.display = 'none';
    document.getElementById('saveBtn').textContent = 'Save Bike';
  }

  function renderPhotoPreview() {
    document.getElementById('photoPreview').innerHTML = currentPhotos.map((src, i) => `
      <div class="form__preview-img">
        <img src="${src}" alt="">
        <span class="form__preview-rm" onclick="removePhoto(${i})">×</span>
      </div>
    `).join('');
  }

  function removePhoto(i) {
    currentPhotos.splice(i, 1);
    renderPhotoPreview();
  }

  // ---------- Photo upload (convert to base64) ----------
  document.getElementById('f_photos').addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        currentPhotos.push(ev.target.result);
        renderPhotoPreview();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  });

  // ---------- Save ----------
  document.getElementById('saveBtn').addEventListener('click', () => {
    const data = {
      name: document.getElementById('f_name').value.trim(),
      sub: document.getElementById('f_sub').value.trim(),
      year: parseInt(document.getElementById('f_year').value) || null,
      price: parseInt(document.getElementById('f_price').value) || null,
      engine: document.getElementById('f_engine').value.trim(),
      power: document.getElementById('f_power').value.trim(),
      mileage: document.getElementById('f_mileage').value.trim(),
      weight: document.getElementById('f_weight').value.trim(),
      transmission: document.getElementById('f_transmission').value.trim(),
      status: document.getElementById('f_status').value,
      description: document.getElementById('f_description').value.trim(),
      images: currentPhotos
    };

    if (!data.name) {
      alert('Please enter a bike name.');
      return;
    }

    if (editingId) {
      updateBike(editingId, data);
    } else {
      addBike(data);
    }

    resetForm();
    renderStats();
    renderTable();
  });

  document.getElementById('cancelBtn').addEventListener('click', resetForm);

  // ---------- Edit ----------
  function editBike(id) {
    const b = getBike(id);
    if (!b) return;

    editingId = id;
    currentPhotos = [...(b.images || [])];

    document.getElementById('formTitle').textContent = 'Edit Bike';
    document.getElementById('editingId').value = id;
    document.getElementById('f_name').value = b.name || '';
    document.getElementById('f_sub').value = b.sub || '';
    document.getElementById('f_year').value = b.year || '';
    document.getElementById('f_price').value = b.price || '';
    document.getElementById('f_engine').value = b.engine || '';
    document.getElementById('f_power').value = b.power || '';
    document.getElementById('f_mileage').value = b.mileage || '';
    document.getElementById('f_weight').value = b.weight || '';
    document.getElementById('f_transmission').value = b.transmission || '';
    document.getElementById('f_status').value = b.status || 'available';
    document.getElementById('f_description').value = b.description || '';
    renderPhotoPreview();
    document.getElementById('cancelBtn').style.display = 'inline-block';
    document.getElementById('saveBtn').textContent = 'Update Bike';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- Toggle status ----------
  function toggleStatus(id) {
    const b = getBike(id);
    if (!b) return;
    updateBike(id, { status: b.status === 'available' ? 'sold' : 'available' });
    renderStats();
    renderTable();
  }

  // ---------- Delete ----------
  function confirmDelete(id) {
    const b = getBike(id);
    if (!b) return;
    if (confirm(`Delete "${b.name}"? This cannot be undone.`)) {
      deleteBike(id);
      if (editingId === id) resetForm();
      renderStats();
      renderTable();
    }
  }

  // expose
  window.editBike = editBike;
  window.toggleStatus = toggleStatus;
  window.confirmDelete = confirmDelete;
  window.removePhoto = removePhoto;

  // initial
  renderStats();
  renderTable();
</script>

</body>
</html>
