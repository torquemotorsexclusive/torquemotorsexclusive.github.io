<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Torque Motorsports Exclusive</title>
  <script>
    // GitHub Pages fallback: route pretty slug URLs to the real pages.
    // /bike/<slug> -> /bike?slug=<slug>   /post/<slug> -> /post?slug=<slug>
    (function () {
      var m = location.pathname.match(/^\/(bike|post)\/([^\/]+)\/?$/);
      if (m) {
        location.replace('/' + m[1] + '?slug=' + encodeURIComponent(decodeURIComponent(m[2])));
      }
    })();
  </script>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="detail" style="min-height:70vh;display:flex;align-items:center;justify-content:center;">
    <div class="empty-state" style="text-align:center;">
      <h3>Page not found</h3>
      <p>The page you're looking for doesn't exist or has moved.</p>
      <a href="/" class="btn btn--primary" style="margin-top:1rem;">Back to Home</a>
      <a href="/inventory" class="btn btn--ghost" style="margin-top:1rem;">The Garage</a>
    </div>
  </main>
</body>
</html>
